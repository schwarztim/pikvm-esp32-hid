; ESP32-S3 PiKVM Pico HID drop-in replacement
; Board: ESP32-S3-N16R8 (16MB flash, 8MB PSRAM, native USB-OTG)
[env:esp32s3]
platform = espressif32 @ ^6.6.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; USB-OTG for HID (not the default serial-JTAG)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCFG_TUD_HID=3
    -DCFG_TUD_CDC=0
    -DCFG_TUD_VENDOR=0
    -DCFG_TUD_MSC=0
    -DCFG_TUD_MIDI=0
    -DCFG_TUD_VIDEO=0
    -DCFG_TUD_DFU_RUNTIME=0

monitor_speed = 115200
upload_port = /dev/cu.usbmodem5B900311831
upload_speed = 921600

; OTA env: push firmware wirelessly from Pi or Mac once WiFi is up.
; Usage (from Pi or Mac with config.h present):
;   pio run -e esp32s3_ota -t upload
; The ESP32 must be on WiFi. Find its IP from the serial monitor or kvmd.
[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
; Set ESP32_IP in env or replace here with the ESP32's LAN IP:
upload_port = ${sysenv.ESP32_IP}
upload_speed = 921600
